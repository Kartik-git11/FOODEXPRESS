<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Track Order | FeastDash</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-flex">
      <a href="index.html" class="brand">🍕 Feast<span>Dash</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="order.html" class="active">Track Order</a>
        <a href="restaurant-dashboard.html">Kitchen Hub</a>
        <a href="delivery-dashboard.html">Courier Hub</a>
      </nav>
      <a href="cart.html" class="cart-pill">🛒 Cart</a>
    </div>
  </header>

  <main class="container" style="padding-top: 25px; max-width: 800px;">
    <h2>Live Order Status & GPS Tracker</h2>

    <div class="box" style="margin-top: 15px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h3 id="order-id">ORD-9842</h3>
          <p id="order-meta" style="color: #64748b; font-size: 13px;">Instant Delivery • Arriving in 20 mins</p>
        </div>
        <button onclick="advanceDemoStatus()" class="btn btn-sm">Simulate Next Stage →</button>
      </div>

      <!-- Stepper -->
      <div class="stepper" id="stepper">
        <div class="step done" id="st-placed"><div class="step-dot">1</div>Placed</div>
        <div class="step active" id="st-cooking"><div class="step-dot">2</div>Kitchen Prep</div>
        <div class="step" id="st-ready"><div class="step-dot">3</div>Ready</div>
        <div class="step" id="st-enroute"><div class="step-dot">4</div>Out for Delivery</div>
        <div class="step" id="st-delivered"><div class="step-dot">5</div>Delivered</div>
      </div>

      <!-- Courier Details -->
      <div style="background: #f8fafc; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <strong>Assigned Courier: Marcus Vance</strong>
          <div style="font-size: 12px; color: #64748b;">Honda Electric Scooter • ⭐ 4.9 Rating</div>
        </div>
        <button onclick="alert('Calling Marcus: +1 (555) 234-8901')" class="btn btn-sm btn-outline">📞 Call Driver</button>
      </div>

      <!-- Order Items Summary -->
      <div id="order-summary" style="margin-top: 15px; font-size: 13px;"></div>
    </div>
  </main>

  <script>
    const defaultOrder = { id: 'ORD-9842', status: 'cooking', items: [{ name: 'Truffle & Mushroom Pizza', qty: 1, price: 18.99 }] };
    let orders = JSON.parse(localStorage.getItem('orders') || '[]');
    if (orders.length === 0) { orders = [defaultOrder]; localStorage.setItem('orders', JSON.stringify(orders)); }
    let current = orders[0];

    const stages = ['placed', 'cooking', 'ready', 'enroute', 'delivered'];

    function updateUI() {
      document.getElementById('order-id').textContent = 'Order ID: ' + current.id;
      const curIdx = stages.indexOf(current.status || 'placed');

      stages.forEach((st, idx) => {
        const el = document.getElementById('st-' + st);
        el.className = 'step';
        if (idx < curIdx) el.classList.add('done');
        else if (idx === curIdx) el.classList.add('active');
      });

      document.getElementById('order-summary').innerHTML = '<strong>Items:</strong> ' + 
        (current.items || []).map(i => `${i.qty}x ${i.name}`).join(', ');
    }

    function advanceDemoStatus() {
      const curIdx = stages.indexOf(current.status || 'placed');
      if (curIdx < stages.length - 1) {
        current.status = stages[curIdx + 1];
        orders[0] = current;
        localStorage.setItem('orders', JSON.stringify(orders));
        updateUI();
      } else {
        alert('Order is already delivered!');
      }
    }

    updateUI();
  </script>
</body>
</html>
