<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Food Express</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <header class="header">
    <a href="index.html" class="logo"><div class="logo-icon">🍔</div>Food <span>Express</span></a>
    <nav class="nav" id="mainNav">
      <a href="index.html">Home</a>
      <a href="index.html#menuSection">Menu</a>
      <a href="orders.html" id="ordersLink" style="display:none;">Orders</a>
      <a href="profile.html" class="active" id="profileLink" style="display:none;">Profile</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="cart-btn">🛒<span class="cart-count" id="cartCount" style="display:none;">0</span></a>
      <a href="login.html" class="btn btn-outline btn-small" id="loginBtn">Login</a>
      <a href="register.html" class="btn btn-primary btn-small" id="registerBtn">Sign Up</a>
      <button class="btn btn-outline btn-small" id="logoutBtn" style="display:none;" onclick="logoutUser()">Logout</button>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </header>

  <section class="section" style="max-width:700px; margin:0 auto;">
    <div class="section-head">
      <div>
        <h2>My Profile 👤</h2>
        <p>Manage your account information</p>
      </div>
    </div>

    <div id="profileContent">
      <!-- Injected by JS -->
    </div>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
