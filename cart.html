<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Food Express</title>

  <link rel="stylesheet" href="css/style.css">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Header -->
  <header class="header">

    <a href="index.html" class="logo">
      <div class="logo-icon">🍔</div>
      Food <span>Express</span>
    </a>

    <nav class="nav" id="mainNav">
      <a href="index.html">Home</a>
      <a href="index.html#menuSection">Menu</a>
      <a href="orders.html" id="ordersLink" style="display:none;">Orders</a>
      <a href="profile.html" id="profileLink" style="display:none;">Profile</a>
    </nav>

    <div class="header-actions">

      <a href="cart.html"
         class="cart-btn"
         style="background:var(--primary-light);">
        🛒
        <span class="cart-count" id="cartCount" style="display:none;">0</span>
      </a>

      <a href="login.html"
         class="btn btn-outline btn-small"
         id="loginBtn">
        Login
      </a>

      <a href="register.html"
         class="btn btn-primary btn-small"
         id="registerBtn">
        Sign Up
      </a>

      <button
        class="btn btn-outline btn-small"
        id="logoutBtn"
        style="display:none;"
        onclick="logoutUser()">
        Logout
      </button>

      <button class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </header>


  <!-- Cart Section -->
  <section class="section">

    <div class="section-head">

      <div>
        <h2>Your Cart 🛒</h2>
        <p>Review your items and checkout</p>
      </div>

      <button
        class="btn btn-outline btn-small"
        onclick="clearCart()"
        id="clearCartBtn">
        Clear Cart
      </button>

    </div>


    <div class="cart-layout">

      <!-- Cart Items -->
      <div class="cart-items" id="cartContainer">
        <!-- Cart items injected by JavaScript -->
      </div>


      <!-- Checkout -->
      <div
        class="cart-summary"
        id="checkoutSection"
        style="display:none;">

        <h3>Order Summary</h3>

        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">₹0</span>
        </div>

        <div class="summary-row">
          <span>Delivery Fee</span>
          <span id="deliveryFee">₹40</span>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span id="total">₹0</span>
        </div>


        <!-- Delivery Details -->
        <div class="checkout-box">

          <h4 style="margin-bottom:12px;">
            Delivery Details
          </h4>

          <div class="form-group">

            <label>Delivery Address</label>

            <textarea
              id="deliveryAddress"
              placeholder="House No, Street, Area, City"
              required></textarea>

          </div>


          <div class="form-group">

            <label>Phone Number</label>

            <input
              type="tel"
              id="deliveryPhone"
              placeholder="9876543210"
              required>

          </div>


          <button
            class="btn btn-primary btn-full"
            style="height:52px; margin-top:20px; font-size:1.05rem;"
            onclick="placeOrder()">

            Place Order 🎉

          </button>

        </div>

      </div>

    </div>

  </section>


  <script src="js/script.js"></script>

</body>
</html>
