<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Food Express</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <header class="header">
    <a href="index.html" class="logo"><div class="logo-icon">🍔</div>Food <span>Express</span></a>
    <nav class="nav" id="mainNav">
      <a href="index.html">Home</a>
      <a href="index.html#menuSection">Menu</a>
      <a href="orders.html" id="ordersLink" style="display:none;">Orders</a>
      <a href="profile.html" id="profileLink" style="display:none;">Profile</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="cart-btn">🛒<span class="cart-count" id="cartCount" style="display:none;">0</span></a>
      <a href="login.html" class="btn btn-outline btn-small" id="loginBtn">Login</a>
      <a href="register.html" class="btn btn-primary btn-small" id="registerBtn">Sign Up</a>
      <button class="btn btn-outline btn-small" id="logoutBtn" style="display:none;" onclick="logoutUser()">Logout</button>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-card">
      <h1>Forgot Password? 🔑</h1>
      <p class="sub">Enter your registered email to reset password</p>

      <div class="error-msg" id="forgotError"></div>
      <div class="success-msg" id="forgotSuccess"></div>

      <form id="forgotForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="forgotEmail" placeholder="example@gmail.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="height:50px;">Verify Email</button>
      </form>

      <div id="resetFormDiv" style="display:none; margin-top:24px; padding-top:24px; border-top:1px solid var(--border);">
        <h3 style="margin-bottom:12px;">Reset Your Password</h3>
        <div class="error-msg" id="resetError"></div>
        <div class="success-msg" id="resetSuccess"></div>
        <form id="resetPasswordForm">
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password" required>
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmNewPassword" placeholder="Confirm new password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full" style="height:50px;">Update Password</button>
        </form>
      </div>

      <div class="auth-footer" style="margin-top:20px;">
        Remember password? <a href="login.html">Sign In</a> • <a href="register.html">Create Account</a>
      </div>

      <div style="margin-top:16px; padding:10px; background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; font-size:0.82rem; color:#9a3412;">
        ⚠️ This is a frontend demo only. No real email is sent. Password is updated directly in localStorage.
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
