<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Courier Portal | FeastDash</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-flex">
      <a href="index.html" class="brand">🛵 Feast<span>Courier</span></a>
      <nav class="nav-links">
        <a href="index.html">Customer View</a>
        <a href="restaurant-dashboard.html">Kitchen Hub</a>
        <a href="delivery-dashboard.html" class="active">Courier Hub</a>
      </nav>
      <span class="btn btn-sm btn-outline" style="color: #10b981; border-color: #10b981;">● Online Shift</span>
    </div>
  </header>

  <main class="container" style="padding-top: 25px; max-width: 800px;">
    <div class="box" style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h2>Marcus Vance (Courier)</h2>
        <p style="color: #64748b; font-size: 13px;">Electric Honda Scooter • ⭐ 4.94 Rating</p>
      </div>
      <div style="text-align: right;">
        <span style="font-size: 11px; color: #64748b; text-transform: uppercase;">Today's Payout</span>
        <div style="font-size: 22px; font-weight: 900; color: #10b981;">$68.50</div>
      </div>
    </div>

    <h2>Active Delivery Dispatch Task</h2>
    <div class="box" id="active-task-container" style="margin-top: 15px;"></div>
  </main>

  <script>
    function render() {
      const orders = JSON.parse(localStorage.getItem('orders') || '[]');
      const active = orders.find(o => o.status === 'ready' || o.status === 'enroute') || orders[0];
      const container = document.getElementById('active-task-container');

      if (!active) {
        container.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">No pending delivery assignments right now.</p>';
        return;
      }

      container.innerHTML = `
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
          <div>
            <h3>Task: ${active.id}</h3>
            <span style="font-size: 12px; font-weight: bold; color: #f97316; text-transform: uppercase;">Status: ${active.status || 'Ready for Pickup'}</span>
          </div>
          <strong style="color: #10b981; font-size: 18px;">+$6.50 Payout</strong>
        </div>

        <div style="background: #f8fafc; padding: 14px; border-radius: 8px; margin-bottom: 15px;">
          <div><strong>1. Pickup Restaurant:</strong> Bella Italia Trattoria (142 Little Italy Way)</div>
          <div style="margin-top: 6px;"><strong>2. Dropoff Customer:</strong> ${active.customer || 'Alex Morgan'} (${active.address || '742 Evergreen Terrace, Apt 4B'})</div>
          <div style="font-size: 12px; color: #64748b; margin-top: 6px;">Instructions: "Leave at front door, buzzer 402"</div>
        </div>

        ${active.status === 'enroute' ? `
          <button onclick="updateStep('${active.id}', 'delivered')" class="btn btn-block" style="background: #10b981; padding: 12px; font-size: 14px;">
            ✓ Arrived at Customer Door • Mark as Delivered
          </button>
        ` : `
          <button onclick="updateStep('${active.id}', 'enroute')" class="btn btn-block" style="padding: 12px; font-size: 14px;">
            📦 Confirm Pickup from Kitchen & Start Trip
          </button>
        `}
      `;
    }

    function updateStep(orderId, nextStatus) {
      let orders = JSON.parse(localStorage.getItem('orders') || '[]');
      const ord = orders.find(o => o.id === orderId);
      if (ord) ord.status = nextStatus;
      localStorage.setItem('orders', JSON.stringify(orders));
      render();
      alert('Trip status updated to: ' + nextStatus);
    }

    render();
  </script>
</body>
</html>
