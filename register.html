<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Food Express</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <header class="header">
    <a href="index.html" class="logo"><div class="logo-icon">🍔</div>Food <span>Express</span></a>
    <nav class="nav" id="mainNav">
      <a href="index.html">Home</a>
      <a href="index.html#menuSection">Menu</a>
      <a href="orders.html" id="ordersLink" style="display:none;">Orders</a>
      <a href="profile.html" id="profileLink" style="display:none;">Profile</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="cart-btn">🛒<span class="cart-count" id="cartCount" style="display:none;">0</span></a>
      <a href="login.html" class="btn btn-outline btn-small" id="loginBtn">Login</a>
      <a href="register.html" class="btn btn-primary btn-small" id="registerBtn">Sign Up</a>
      <button class="btn btn-outline btn-small" id="logoutBtn" style="display:none;" onclick="logoutUser()">Logout</button>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-card">
      <h1>Create Account 🎉</h1>
      <p class="sub">Join Food Express and order delicious food</p>

      <div class="error-msg" id="regError"></div>
      <div class="success-msg" id="regSuccess"></div>

      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Gautam Kumar" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" placeholder="example@gmail.com" required>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="regPhone" placeholder="9876543210" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Min 6 chars" required>
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="regConfirmPassword" placeholder="Confirm password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="height:50px; margin-top:8px;">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
